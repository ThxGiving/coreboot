# lm-sensors configuration for the BKHD 1264NP-12-4L (ITE IT8625E hwmon).
#
# Install on the OS as /etc/sensors.d/bkhd.conf. This carries the board-specific
# calibration that the chip itself cannot know: the +12V rail is read through an
# external resistor divider (VIN2), so its raw ADC value must be scaled. The
# factor below was calibrated against a DC-extension reading of 12.0 V.
#
# Use the out-of-tree it87 driver with force_id=0x8625 (mainline lacks IT8625E):
#   echo "options it87 force_id=0x8625" > /etc/modprobe.d/it87.conf
#
# Note: the IT8625E "CPU" temperature comes from the EC reading the package
# via PECI (configured by coreboot's env_ctrl plus the board temp hook); the
# die temperature is also available via the kernel coretemp driver. The board's
# second thermal input (TMPIN2) is unpopulated and is hidden below.

chip "it8625-isa-0a30"
    label in0 "Vcore"
        set in0_min 0.4
        set in0_max 1.5
    label in1 "VDIMM"
        set in1_min 1.0
        set in1_max 1.3
    label in2 "+12V"
        compute in2 @*5.9940, @/5.9940
        set in2_min 10.8
        set in2_max 13.2
    label in7 "+3VSB"
        set in7_min 3.0
        set in7_max 3.6
    label in8 "Vbat"
    label in9 "+3.3V"
    # in3..in6 are divided rails of unknown assignment - hidden until traced.
    ignore in3
    ignore in4
    ignore in5
    ignore in6
    label temp1 "CPU"
    # TMPIN2 has no populated sensor on this board: it reads a frozen ~26 C
    # (below room ambient = impossible), does not track load, and re-routing the
    # temp source has no effect. Stock firmware shows the same phantom. Hidden.
    ignore temp2
    ignore temp3
    ignore intrusion0
    # Only one fan header (J2G1) = FAN1/pwm1 (HW-confirmed 2026-06-24: the fan
    # responds to it87 pwm1); the rest are unwired chip channels.
    label fan1 "CPU Fan"
    label pwm1 "CPU Fan PWM"
    ignore pwm2
    ignore pwm3
    ignore pwm4
    ignore pwm5
    ignore pwm6
    ignore fan2
    ignore fan3
    ignore fan4
    ignore fan5
    ignore fan6
