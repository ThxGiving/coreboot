# lm-sensors config for bkhd/1264np_12_4l (ITE IT8625E hardware monitor).
# Install as /etc/sensors.d/bkhd.conf on the OS. Provides rail labels and the
# +12V divider calibration so `sensors` shows meaningful values.
#
# The coreboot devicetree programs the EC at boot (TMPIN1=CPU, TMPIN2=Board,
# all VINs, FAN1 SmartGuardian). The IT8625E is NOT in the mainline it87
# driver yet, so load the out-of-tree driver (see README.md) with
# force_id=0x8625; the chip then enumerates as it8625-isa-0a30 (coreboot puts
# the HWM at I/O base 0xa30).
#
# Confirmed: Vcore/VDIMM (undivided), +3VSB/Vbat/+3.3V (driver-internal scale).
# +12V = VIN2, x5.994 calibrated against a 12.0 V reference (DC extension).
# in3/in4/in5/in6 (~2 V, divided) = rail mapping still UNKNOWN -> hidden until
#   confirmed with a multimeter. No case-open sensor on this board.
# Only one fan header (J2G1) = FAN1 / pwm1 (HW-confirmed: the fan responds
#   to it87 pwm1); other fan/pwm channels are unrouted and hidden.

chip "it8625-isa-0a30"
    label in0 "Vcore"
        set in0_min 0.4
        set in0_max 1.5
    label in1 "VDIMM"
        set in1_min 1.0
        set in1_max 1.3
    label in2 "+12V"
        compute in2 @*5.9940, @/5.9940
        set in2_min 10.8
        set in2_max 13.2
    label in7 "+3VSB"
        set in7_min 3.0
        set in7_max 3.6
    label in8 "Vbat"
    label in9 "+3.3V"
    ignore in3
    ignore in4
    ignore in5
    ignore in6
    label temp1 "CPU"
    label temp2 "Board"
    ignore temp3
    ignore intrusion0
    label fan1 "CPU Fan"
    label pwm1 "CPU Fan PWM"
    ignore pwm2
    ignore pwm3
    ignore pwm4
    ignore pwm5
    ignore pwm6
    ignore fan2
    ignore fan3
    ignore fan4
    ignore fan5
    ignore fan6
